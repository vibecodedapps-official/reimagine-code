name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Lint compares each plugin with its release tag (R49), so it needs the tags and their history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
      - name: Exclude the workspace and temp from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The sh suites fork thousands of processes over small files; real-time scanning on
          # every write may be part of the Windows job's cost (issue 48). The paths printed
          # first say where the suites' temp files sit, for comparison with the exclusions.
          (Get-Command sh).Source
          sh -c 'set -e; d=$(mktemp -d -u); cygpath -m "$d"'
          node -e 'console.log(require("os").tmpdir())'
          (Get-MpComputerStatus).RealTimeProtectionEnabled
          # Long names: TEMP comes in 8.3 form (RUNNER~1), which an exclusion may not match.
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP) | ForEach-Object { (Get-Item $_).FullName }
          $paths
          if (-not (Get-Command Add-MpPreference -ErrorAction SilentlyContinue)) {
            Write-Warning 'defender exclusion: unavailable (no Add-MpPreference)'
            exit 0
          }
          Add-MpPreference -ExclusionPath $paths
          $set = (Get-MpPreference).ExclusionPath
          foreach ($p in $paths) {
            if ($set -notcontains $p) { throw "defender exclusion: $p not set" }
          }
          Write-Output 'defender exclusion: applied'
      - run: npm test
      - name: cca awk suites with mawk
        # Ubuntu's default awk is gawk; the audit plugin's scripts must also run on mawk.
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mawk
          mkdir -p "$RUNNER_TEMP/mawk-bin"
          ln -sf "$(command -v mawk)" "$RUNNER_TEMP/mawk-bin/awk"
          export PATH="$RUNNER_TEMP/mawk-bin:$PATH"
          awk -W version 2>&1 | head -n 1
          for t in handoff readonly live memory ledger working-tree revert-tests; do
            sh "tests/cca/$t.sh"
          done

  validate:
    name: validate manifests
    runs-on: ubuntu-latest
    env:
      # Pinned so a new Claude Code release cannot change the result without a commit here.
      # Pick a release at least seven days old, so a bad release has time to be pulled.
      CLAUDE_CODE_VERSION: 2.1.283
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: claude plugin validate --strict
        shell: bash
        run: |
          set -euo pipefail
          claude --version
          claude plugin validate --strict .
          for manifest in plugins/*/.claude-plugin/plugin.json; do
            claude plugin validate --strict "${manifest%/.claude-plugin/plugin.json}"
          done
